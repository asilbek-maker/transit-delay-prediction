name: Collect Seoul bus arrivals

# Four ~5.75-hour shifts cover the service day. Each shift polls 7 trunk routes
# (146, 152, 301, 302, 303, 370, 753) every 10 minutes (~840 calls/day) and commits gzip CSVs
# to the live-data branch.
on:
  schedule:
    - cron: "50 20,2,8,14 * * *"     # 05:50, 11:50, 17:50, 23:50 KST
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep polling"
        default: "5"

permissions:
  contents: write

concurrency:
  group: collect-bus
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: live-data
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll the API
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: >
          python -m src.collectors.seoul_bus
          --minutes "${{ inputs.minutes || '345' }}"
          --out store/bus
          --require-key

      - name: Commit new data
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bus 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "data: bus arrivals $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin live-data && git push origin HEAD:live-data && break
            sleep 10
          done
