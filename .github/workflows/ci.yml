name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # must match the Streamlit Cloud runtime
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install app dependencies
        run: pip install -r app/requirements.txt pytest
      - name: Run tests (feature logic, saved models, Streamlit app)
        run: pytest -v
