name: Collect Seoul subway positions

# Four ~5.75-hour shifts per day cover the whole service day. Each shift polls
# every 3 minutes (service hours only) and commits the CSVs to the live-data
# branch, keeping main free of data commits ("git scraping").
on:
  schedule:
    - cron: "55 20,2,8,14 * * *"     # 05:55, 11:55, 17:55, 23:55 KST
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep polling"
        default: "5"

permissions:
  contents: write

concurrency:
  group: collect-subway
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: live-data
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll the API
        env:
          SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
        run: >
          python -m src.collectors.seoul_subway
          --minutes "${{ inputs.minutes || '345' }}"
          --interval 180
          --out store/subway
          ${{ github.event_name == 'schedule' && '--require-key' || '' }}

      - name: Commit new data
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subway 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "data: subway positions $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin live-data
          git push origin HEAD:live-data
